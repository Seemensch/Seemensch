<title>Christian Hannker · Hannker Dental</title>
<style>
  :root{--ink:#1d2125;--muted:#5f6368;--line:#d9d9d9;--red:#d0111b;--chip:#efefef}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding-bottom:40px}
  header{padding:34px 40px 26px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
  .logo{}
  .logo img{width:220px;max-width:70vw;height:auto;display:block}
  .photo{width:190px;height:190px;border-radius:50%;overflow:hidden;margin:28px auto 0;position:relative;border:5px solid #fff;background:#eee}
  .photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.06)}
  h1{text-align:center;font-size:32px;font-weight:600;margin-top:22px;letter-spacing:-.01em}
  .role{text-align:center;font-size:19px;color:#333;margin-top:6px}
  .pad{padding:0 34px}
  .hint{margin-top:28px;border:1.5px solid var(--red);color:var(--red);text-align:center;padding:12px;font-size:16px}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;text-align:center}
  .actions a{color:var(--ink);text-decoration:none;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .ic{width:52px;height:52px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center}
  .ic svg{width:22px;height:22px;fill:var(--ink)}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0 26px}
  .co{font-weight:700;font-size:17px}
  .addr,.tel{margin-top:14px;font-size:16px;line-height:1.6;color:#333}
  .tel a,.mail{color:var(--red);text-decoration:none}
  .mail{display:inline-block;margin-top:14px;font-size:16px}
  .qr{width:220px;height:auto;display:block;margin:0 auto}
  .qcap{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
  .social{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .social a{flex:1;text-align:center;padding:11px 8px;border-radius:22px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:15px}
</style>
</head>
